name: ground_truth
description: "Real-Time Groundwater Resource Evaluation using DWLR Data"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Real-time
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.0
  firebase_auth: ^6.1.3

  # Location & Maps
  # Location & Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Charting
  fl_chart: ^1.1.1

  # Notifications
  flutter_local_notifications: ^19.5.0  

  # Sharing & Export
  share_plus: ^12.0.1
  pdf: ^3.11.0
  csv: ^6.0.0

  # Forms & UI
  flutter_form_builder: ^10.2.0
  image_picker: ^1.0.0

  # State & Storage
  provider: ^6.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  google_generative_ai: ^0.4.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.0
  flutter_dotenv: ^6.0.0
  uuid: ^4.0.0

  # UI Components
  shimmer: ^3.0.0
  badges: ^3.1.0
  lottie: ^3.3.2
  animate_do: ^4.2.0
  flutter_secure_storage: ^10.0.0
  googleai_dart: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env
